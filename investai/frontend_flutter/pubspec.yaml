name: investai
description: InvestAI - Seu assistente financeiro inteligente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  device_preview: ^1.1.0
  fl_chart: ^0.68.0
  # Renderiza o termo de consentimento, que é mantido em Markdown no
  # repositório para poder ser entregue como documento.
  flutter_markdown: ^0.7.1
  # Salvam o relatório exportado (PDF/CSV): pasta Downloads no desktop e
  # download pelo navegador na web.
  path_provider: ^2.1.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
