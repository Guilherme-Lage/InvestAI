<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório — InvestAI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>📈 InvestAI</h1>
        <nav>
            <a href="usuarios.html">Usuários</a>
            <a href="movimentacoes.html">Movimentações</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="metas.html">Metas</a>
            <a href="relatorio.html" class="ativo">Relatório</a>
        </nav>
    </header>
    <main>
        <div class="topo">
            <h2>Relatório financeiro</h2>
        </div>
        <p class="aviso">
            Consulta que combina dados de Movimentações, Investimentos e Metas de um
            mesmo usuário para montar um resumo financeiro completo.
        </p>

        <div class="filtros">
            <div class="campo">
                <label for="usuario">Usuário</label>
                <select id="usuario"></select>
            </div>
            <div class="botoes-filtro">
                <button class="btn" id="btnGerar">Gerar relatório</button>
            </div>
        </div>

        <div id="conteudo"></div>

        <div class="secao">
            <h3>Buscar usuários (com estatísticas)</h3>
            <div class="filtros">
                <div class="campo">
                    <label for="termoBusca">Nome ou e-mail</label>
                    <input type="text" id="termoBusca" placeholder="ex.: ana ou @gmail.com">
                </div>
                <div class="botoes-filtro">
                    <button class="btn btn-sec" id="btnBuscar">Buscar</button>
                </div>
            </div>
            <div id="resultadoBusca"></div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        const seletorUsuario = document.getElementById("usuario");
        const conteudo = document.getElementById("conteudo");
        const resultadoBusca = document.getElementById("resultadoBusca");

        async function carregarUsuarios() {
            const usuarios = await apiListar("usuarios");
            seletorUsuario.innerHTML = usuarios
                .map(u => `<option value="${u.id}">${u.nome}</option>`)
                .join("");
            return usuarios;
        }

        function cardMetric(rotulo, valor, classe = "") {
            return `<div class="card-metric">
                        <div class="rotulo">${rotulo}</div>
                        <div class="valor ${classe}">${valor}</div>
                    </div>`;
        }

        async function gerarRelatorio() {
            const usuarioId = seletorUsuario.value;
            if (!usuarioId) {
                conteudo.innerHTML = '<p class="vazio">Cadastre um usuário para gerar o relatório.</p>';
                return;
            }
            conteudo.innerHTML = '<p class="vazio">Carregando...</p>';
            try {
                const r = await apiGet(`usuarios/${usuarioId}/relatorio`);
                if (r.erro) {
                    conteudo.innerHTML = `<p class="aviso">${r.erro}</p>`;
                    return;
                }
                const saldoClasse = r.saldo >= 0 ? "positivo" : "negativo";
                conteudo.innerHTML = `
                    <h3 style="margin-top:20px;">Resumo de ${r.usuario.nome}</h3>
                    <div class="cards-relatorio">
                        ${cardMetric("Total de rendas", formatarReal(r.total_rendas))}
                        ${cardMetric("Total de gastos", formatarReal(r.total_gastos))}
                        ${cardMetric("Saldo", formatarReal(r.saldo), saldoClasse)}
                        ${cardMetric("Total investido", formatarReal(r.total_investido))}
                        ${cardMetric("Rendimento total", formatarReal(r.total_rendimento))}
                        ${cardMetric("Patrimônio total", formatarReal(r.patrimonio_total), "positivo")}
                        ${cardMetric("Metas concluídas", `${r.qtd_metas_concluidas} / ${r.qtd_metas}`)}
                    </div>`;
            } catch (e) {
                conteudo.innerHTML = '<p class="aviso">Erro ao conectar na API. Verifique se o backend está rodando.</p>';
            }
        }

        async function buscarUsuarios() {
            const termo = document.getElementById("termoBusca").value.trim();
            resultadoBusca.innerHTML = '<p class="vazio">Buscando...</p>';
            try {
                const usuarios = await apiGet("usuarios/busca", { termo });
                if (!usuarios.length) {
                    resultadoBusca.innerHTML = '<p class="vazio">Nenhum usuário encontrado.</p>';
                    return;
                }
                let html = `<table><thead><tr>
                    <th>Nome</th><th>E-mail</th><th>Movimentações</th>
                    <th>Investimentos</th><th>Total investido</th><th>Metas</th>
                    </tr></thead><tbody>`;
                usuarios.forEach(u => {
                    html += `<tr>
                        <td>${u.nome}</td>
                        <td>${u.email}</td>
                        <td>${u.qtd_movimentacoes}</td>
                        <td>${u.qtd_investimentos}</td>
                        <td>${formatarReal(u.total_investido)}</td>
                        <td>${u.qtd_metas}</td>
                    </tr>`;
                });
                html += "</tbody></table>";
                resultadoBusca.innerHTML = html;
            } catch (e) {
                resultadoBusca.innerHTML = '<p class="aviso">Erro ao conectar na API.</p>';
            }
        }

        document.getElementById("btnGerar").addEventListener("click", gerarRelatorio);
        document.getElementById("btnBuscar").addEventListener("click", buscarUsuarios);

        (async () => {
            const usuarios = await carregarUsuarios();
            if (usuarios.length) {
                await gerarRelatorio();
            } else {
                conteudo.innerHTML = '<p class="vazio">Cadastre um usuário para gerar o relatório.</p>';
            }
            await buscarUsuarios();
        })();
    </script>
</body>
</html>
