<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação — InvestAI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>📈 InvestAI</h1>
        <nav>
            <a href="usuarios.html">Usuários</a>
            <a href="movimentacoes.html" class="ativo">Movimentações</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="metas.html">Metas</a>
        </nav>
    </header>
    <main>
        <h2 id="titulo">Nova movimentação</h2>

        <form id="formulario">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" required>

            <label for="tipo">Tipo</label>
            <select id="tipo">
                <option value="renda">Renda</option>
                <option value="gasto">Gasto</option>
            </select>

            <label for="valor">Valor (R$)</label>
            <input type="number" step="0.01" id="valor" required>

            <label for="data">Data</label>
            <input type="text" id="data" placeholder="02/07/2026" required>

            <label for="usuario_id">Usuário</label>
            <select id="usuario_id" required></select>

            <div class="botoes-form">
                <button class="btn" type="submit">Salvar</button>
                <a class="btn btn-sec" href="movimentacoes.html">Cancelar</a>
            </div>
        </form>
    </main>

    <script src="js/api.js"></script>
    <script>
        const id = getIdDaUrl();

        async function carregarUsuarios(selecionado) {
            const usuarios = await apiListar("usuarios");
            const select = document.getElementById("usuario_id");
            select.innerHTML = "";
            usuarios.forEach(u => {
                const op = document.createElement("option");
                op.value = u.id;
                op.textContent = u.nome;
                if (selecionado && u.id === selecionado) op.selected = true;
                select.appendChild(op);
            });
        }

        async function preencher() {
            if (!id) {
                await carregarUsuarios();
                return;
            }
            document.getElementById("titulo").textContent = "Editar movimentação";
            const m = await apiBuscar("movimentacoes", id);
            document.getElementById("descricao").value = m.descricao;
            document.getElementById("tipo").value = m.tipo;
            document.getElementById("valor").value = m.valor;
            document.getElementById("data").value = m.data;
            await carregarUsuarios(m.usuario_id);
        }

        document.getElementById("formulario").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const dados = {
                descricao: document.getElementById("descricao").value,
                tipo: document.getElementById("tipo").value,
                valor: document.getElementById("valor").value,
                data: document.getElementById("data").value,
                usuario_id: document.getElementById("usuario_id").value,
            };
            if (id) {
                await apiAtualizar("movimentacoes", id, dados);
            } else {
                await apiCriar("movimentacoes", dados);
            }
            window.location.href = "movimentacoes.html";
        });

        preencher();
    </script>
</body>
</html>
