<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários — InvestAI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>📈 InvestAI</h1>
        <nav>
            <a href="usuarios.html" class="ativo">Usuários</a>
            <a href="movimentacoes.html">Movimentações</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="metas.html">Metas</a>
            <a href="relatorio.html">Relatório</a>
        </nav>
    </header>
    <main>
        <div class="topo">
            <h2>Usuários</h2>
            <a class="btn" href="usuario_form.html">+ Novo usuário</a>
        </div>

        <p class="aviso">
            Filtre os usuários pelo perfil de risco — consulta com WHERE na camada
            Repository. Para busca por nome/e-mail com estatísticas, veja a tela
            <a href="relatorio.html" style="color: var(--verde);">Relatório</a>.
        </p>

        <div class="filtros">
            <div class="campo">
                <label for="perfil">Perfil de risco</label>
                <select id="perfil">
                    <option value="">Todos</option>
                    <option value="conservador">Conservador</option>
                    <option value="moderado">Moderado</option>
                    <option value="arrojado">Arrojado</option>
                </select>
            </div>
            <div class="botoes-filtro">
                <button class="btn" id="btnFiltrar">Filtrar</button>
            </div>
        </div>

        <div id="conteudo">
            <p class="vazio">Carregando...</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        async function carregar() {
            const conteudo = document.getElementById("conteudo");
            try {
                const perfil = document.getElementById("perfil").value;
                const usuarios = perfil
                    ? await apiGet(`usuarios/perfil/${perfil}`)
                    : await apiListar("usuarios");
                if (!usuarios.length) {
                    conteudo.innerHTML = '<p class="vazio">Nenhum usuário cadastrado ainda.</p>';
                    return;
                }
                let html = `<table><thead><tr>
                    <th>Nome</th><th>E-mail</th><th>Perfil de risco</th>
                    <th>Renda mensal</th><th>Ações</th></tr></thead><tbody>`;
                usuarios.forEach(u => {
                    html += `<tr>
                        <td>${u.nome}</td>
                        <td>${u.email}</td>
                        <td>${u.perfil_risco}</td>
                        <td>${formatarReal(u.renda_mensal)}</td>
                        <td class="acoes">
                            <a class="btn btn-sec" href="usuario_form.html?id=${u.id}">Editar</a>
                            <button class="btn btn-del" onclick="excluir(${u.id})">Excluir</button>
                        </td></tr>`;
                });
                html += "</tbody></table>";
                conteudo.innerHTML = html;
            } catch (e) {
                conteudo.innerHTML = '<p class="aviso">Erro ao conectar na API. Verifique se o backend está rodando.</p>';
            }
        }

        async function excluir(id) {
            if (!confirm("Excluir este usuário?")) return;
            await apiExcluir("usuarios", id);
            carregar();
        }

        document.getElementById("btnFiltrar").addEventListener("click", carregar);

        carregar();
    </script>
</body>
</html>
