<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas — InvestAI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>📈 InvestAI</h1>
        <nav>
            <a href="usuarios.html">Usuários</a>
            <a href="movimentacoes.html">Movimentações</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="metas.html" class="ativo">Metas</a>
            <a href="relatorio.html">Relatório</a>
        </nav>
    </header>
    <main>
        <div class="topo">
            <h2>Metas</h2>
            <a class="btn" href="meta_form.html">+ Nova meta</a>
        </div>

        <p class="aviso">
            Metas filtradas por status (comparando valor atual x valor alvo) e
            ordenadas por prazo — consulta feita na camada Repository.
        </p>

        <div class="filtros">
            <div class="campo">
                <label for="usuario">Usuário</label>
                <select id="usuario"></select>
            </div>
        </div>

        <div class="abas">
            <button class="aba-btn ativa" data-status="todas">Todas</button>
            <button class="aba-btn" data-status="em_andamento">Em andamento</button>
            <button class="aba-btn" data-status="concluida">Concluídas</button>
        </div>

        <div id="conteudo">
            <p class="vazio">Carregando...</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        const seletorUsuario = document.getElementById("usuario");
        let statusAtual = "todas";
        let mapaNomes = {};

        async function carregarUsuarios() {
            const usuarios = await apiListar("usuarios");
            mapaNomes = {};
            usuarios.forEach(u => mapaNomes[u.id] = u.nome);
            seletorUsuario.innerHTML = usuarios
                .map(u => `<option value="${u.id}">${u.nome}</option>`)
                .join("");
            return usuarios;
        }

        function renderTabela(itens) {
            if (!itens.length) {
                return '<p class="vazio">Nenhuma meta encontrada para esse filtro.</p>';
            }
            let html = `<table><thead><tr>
                <th>Título</th><th>Alvo</th><th>Atual</th><th>Progresso</th>
                <th>Prazo</th><th>Usuário</th><th>Ações</th></tr></thead><tbody>`;
            itens.forEach(m => {
                const progressoClasse = m.progresso >= 100 ? "badge-pos" : "";
                html += `<tr>
                    <td>${m.titulo}</td>
                    <td>${formatarReal(m.valor_alvo)}</td>
                    <td>${formatarReal(m.valor_atual)}</td>
                    <td class="${progressoClasse}">${m.progresso}%</td>
                    <td>${m.prazo}</td>
                    <td>${mapaNomes[m.usuario_id] || "-"}</td>
                    <td class="acoes">
                        <a class="btn btn-sec" href="meta_form.html?id=${m.id}">Editar</a>
                        <button class="btn btn-del" onclick="excluir(${m.id})">Excluir</button>
                    </td></tr>`;
            });
            html += "</tbody></table>";
            return html;
        }

        async function carregar() {
            const conteudo = document.getElementById("conteudo");
            const usuarioId = seletorUsuario.value;
            if (!usuarioId) {
                conteudo.innerHTML = '<p class="vazio">Cadastre um usuário para ver as metas.</p>';
                return;
            }
            conteudo.innerHTML = '<p class="vazio">Carregando...</p>';
            try {
                let itens;
                if (statusAtual === "todas") {
                    itens = await apiGet(`metas/status/${usuarioId}`, { status: "em_andamento" });
                    const concluidas = await apiGet(`metas/status/${usuarioId}`, { status: "concluida" });
                    itens = itens.concat(concluidas);
                } else {
                    itens = await apiGet(`metas/status/${usuarioId}`, { status: statusAtual });
                }
                conteudo.innerHTML = renderTabela(itens);
            } catch (e) {
                conteudo.innerHTML = '<p class="aviso">Erro ao conectar na API. Verifique se o backend está rodando.</p>';
            }
        }

        async function excluir(id) {
            if (!confirm("Excluir esta meta?")) return;
            await apiExcluir("metas", id);
            carregar();
        }

        document.querySelectorAll(".aba-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".aba-btn").forEach(b => b.classList.remove("ativa"));
                btn.classList.add("ativa");
                statusAtual = btn.dataset.status;
                carregar();
            });
        });

        seletorUsuario.addEventListener("change", carregar);

        (async () => {
            const usuarios = await carregarUsuarios();
            if (usuarios.length) {
                await carregar();
            } else {
                document.getElementById("conteudo").innerHTML =
                    '<p class="vazio">Cadastre um usuário para ver as metas.</p>';
            }
        })();
    </script>
</body>
</html>
