<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investimento — InvestAI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>📈 InvestAI</h1>
        <nav>
            <a href="usuarios.html">Usuários</a>
            <a href="movimentacoes.html">Movimentações</a>
            <a href="investimentos.html" class="ativo">Investimentos</a>
            <a href="metas.html">Metas</a>
            <a href="relatorio.html">Relatório</a>
        </nav>
    </header>
    <main>
        <h2 id="titulo">Novo investimento</h2>

        <form id="formulario">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>

            <label for="tipo">Tipo</label>
            <select id="tipo">
                <option value="Tesouro Selic">Tesouro Selic</option>
                <option value="CDB">CDB</option>
                <option value="LCI/LCA">LCI/LCA</option>
                <option value="Fundo">Fundo</option>
                <option value="Ações">Ações</option>
            </select>

            <label for="valor_aplicado">Valor aplicado (R$)</label>
            <input type="number" step="0.01" id="valor_aplicado" required>

            <label for="rendimento_atual">Rendimento atual (R$)</label>
            <input type="number" step="0.01" id="rendimento_atual" value="0">

            <label for="liquidez">Liquidez</label>
            <select id="liquidez">
                <option value="diaria">Diária</option>
                <option value="no vencimento">No vencimento</option>
            </select>

            <label for="usuario_id">Usuário</label>
            <select id="usuario_id" required></select>

            <div class="botoes-form">
                <button class="btn" type="submit">Salvar</button>
                <a class="btn btn-sec" href="investimentos.html">Cancelar</a>
            </div>
        </form>
    </main>

    <script src="js/api.js"></script>
    <script>
        const id = getIdDaUrl();

        async function carregarUsuarios(selecionado) {
            const usuarios = await apiListar("usuarios");
            const select = document.getElementById("usuario_id");
            select.innerHTML = "";
            usuarios.forEach(u => {
                const op = document.createElement("option");
                op.value = u.id;
                op.textContent = u.nome;
                if (selecionado && u.id === selecionado) op.selected = true;
                select.appendChild(op);
            });
        }

        async function preencher() {
            if (!id) {
                await carregarUsuarios();
                return;
            }
            document.getElementById("titulo").textContent = "Editar investimento";
            const i = await apiBuscar("investimentos", id);
            document.getElementById("nome").value = i.nome;
            document.getElementById("tipo").value = i.tipo;
            document.getElementById("valor_aplicado").value = i.valor_aplicado;
            document.getElementById("rendimento_atual").value = i.rendimento_atual;
            document.getElementById("liquidez").value = i.liquidez;
            await carregarUsuarios(i.usuario_id);
        }

        document.getElementById("formulario").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const dados = {
                nome: document.getElementById("nome").value,
                tipo: document.getElementById("tipo").value,
                valor_aplicado: document.getElementById("valor_aplicado").value,
                rendimento_atual: document.getElementById("rendimento_atual").value,
                liquidez: document.getElementById("liquidez").value,
                usuario_id: document.getElementById("usuario_id").value,
            };
            if (id) {
                await apiAtualizar("investimentos", id, dados);
            } else {
                await apiCriar("investimentos", dados);
            }
            window.location.href = "investimentos.html";
        });

        preencher();
    </script>
</body>
</html>
