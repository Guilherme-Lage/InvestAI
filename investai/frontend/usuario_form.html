<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuário — InvestAI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>📈 InvestAI</h1>
        <nav>
            <a href="usuarios.html" class="ativo">Usuários</a>
            <a href="movimentacoes.html">Movimentações</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="metas.html">Metas</a>
            <a href="relatorio.html">Relatório</a>
        </nav>
    </header>
    <main>
        <h2 id="titulo">Novo usuário</h2>

        <form id="formulario">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="perfil_risco">Perfil de risco</label>
            <select id="perfil_risco">
                <option value="conservador">Conservador</option>
                <option value="moderado">Moderado</option>
                <option value="arrojado">Arrojado</option>
            </select>

            <label for="renda_mensal">Renda mensal (R$)</label>
            <input type="number" step="0.01" id="renda_mensal" value="0">

            <div class="botoes-form">
                <button class="btn" type="submit">Salvar</button>
                <a class="btn btn-sec" href="usuarios.html">Cancelar</a>
            </div>
        </form>
    </main>

    <script src="js/api.js"></script>
    <script>
        const id = getIdDaUrl();

        async function preencher() {
            if (!id) return;
            document.getElementById("titulo").textContent = "Editar usuário";
            const u = await apiBuscar("usuarios", id);
            document.getElementById("nome").value = u.nome;
            document.getElementById("email").value = u.email;
            document.getElementById("perfil_risco").value = u.perfil_risco;
            document.getElementById("renda_mensal").value = u.renda_mensal;
        }

        document.getElementById("formulario").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const dados = {
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                perfil_risco: document.getElementById("perfil_risco").value,
                renda_mensal: document.getElementById("renda_mensal").value,
            };
            if (id) {
                await apiAtualizar("usuarios", id, dados);
            } else {
                await apiCriar("usuarios", dados);
            }
            window.location.href = "usuarios.html";
        });

        preencher();
    </script>
</body>
</html>
