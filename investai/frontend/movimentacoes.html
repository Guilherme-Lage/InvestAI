<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações — InvestAI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>📈 InvestAI</h1>
        <nav>
            <a href="usuarios.html">Usuários</a>
            <a href="movimentacoes.html" class="ativo">Movimentações</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="metas.html">Metas</a>
            <a href="relatorio.html">Relatório</a>
        </nav>
    </header>
    <main>
        <div class="topo">
            <h2>Movimentações</h2>
            <a class="btn" href="movimentacao_form.html">+ Nova movimentação</a>
        </div>

        <p class="aviso">
            Extrato do usuário com filtros por tipo e por período, e ordenação por
            data ou valor — consulta feita na camada Repository com WHERE e ORDER BY.
        </p>

        <div class="filtros">
            <div class="campo">
                <label for="usuario">Usuário</label>
                <select id="usuario"></select>
            </div>
            <div class="campo">
                <label for="tipo">Tipo</label>
                <select id="tipo">
                    <option value="">Todos</option>
                    <option value="renda">Renda</option>
                    <option value="gasto">Gasto</option>
                </select>
            </div>
            <div class="campo">
                <label for="dataInicio">De</label>
                <input type="date" id="dataInicio">
            </div>
            <div class="campo">
                <label for="dataFim">Até</label>
                <input type="date" id="dataFim">
            </div>
            <div class="campo">
                <label for="ordenar">Ordenar por</label>
                <select id="ordenar">
                    <option value="data_desc">Data (mais recente)</option>
                    <option value="data_asc">Data (mais antiga)</option>
                    <option value="valor_desc">Valor (maior)</option>
                    <option value="valor_asc">Valor (menor)</option>
                </select>
            </div>
            <div class="botoes-filtro">
                <button class="btn" id="btnFiltrar">Filtrar</button>
            </div>
        </div>

        <div id="saldoResumo"></div>

        <div id="conteudo">
            <p class="vazio">Carregando...</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        const seletorUsuario = document.getElementById("usuario");
        let mapaNomes = {};

        async function carregarUsuarios() {
            const usuarios = await apiListar("usuarios");
            mapaNomes = {};
            usuarios.forEach(u => mapaNomes[u.id] = u.nome);
            seletorUsuario.innerHTML = usuarios
                .map(u => `<option value="${u.id}">${u.nome}</option>`)
                .join("");
            return usuarios;
        }

        async function carregar() {
            const conteudo = document.getElementById("conteudo");
            const saldoResumo = document.getElementById("saldoResumo");
            const usuarioId = seletorUsuario.value;
            if (!usuarioId) {
                conteudo.innerHTML = '<p class="vazio">Cadastre um usuário para ver o extrato.</p>';
                return;
            }

            const filtros = {
                tipo: document.getElementById("tipo").value,
                data_inicio: document.getElementById("dataInicio").value,
                data_fim: document.getElementById("dataFim").value,
                ordenar: document.getElementById("ordenar").value,
            };

            try {
                const resultado = await apiGet(`movimentacoes/extrato/${usuarioId}`, filtros);
                const itens = resultado.itens || [];

                const saldoClasse = resultado.saldo >= 0 ? "badge-pos" : "badge-neg";
                saldoResumo.innerHTML = `<p class="aviso">Saldo total do usuário:
                    <span class="${saldoClasse}">${formatarReal(resultado.saldo)}</span></p>`;

                if (!itens.length) {
                    conteudo.innerHTML = '<p class="vazio">Nenhuma movimentação encontrada para esse filtro.</p>';
                    return;
                }
                let html = `<table><thead><tr>
                    <th>Descrição</th><th>Tipo</th><th>Valor</th><th>Data</th>
                    <th>Usuário</th><th>Ações</th></tr></thead><tbody>`;
                itens.forEach(m => {
                    const tag = m.tipo === "renda"
                        ? '<span class="tag tag-renda">renda</span>'
                        : '<span class="tag tag-gasto">gasto</span>';
                    html += `<tr>
                        <td>${m.descricao}</td>
                        <td>${tag}</td>
                        <td>${formatarReal(m.valor)}</td>
                        <td>${m.data}</td>
                        <td>${mapaNomes[m.usuario_id] || "-"}</td>
                        <td class="acoes">
                            <a class="btn btn-sec" href="movimentacao_form.html?id=${m.id}">Editar</a>
                            <button class="btn btn-del" onclick="excluir(${m.id})">Excluir</button>
                        </td></tr>`;
                });
                html += "</tbody></table>";
                conteudo.innerHTML = html;
            } catch (e) {
                conteudo.innerHTML = '<p class="aviso">Erro ao conectar na API. Verifique se o backend está rodando.</p>';
            }
        }

        async function excluir(id) {
            if (!confirm("Excluir esta movimentação?")) return;
            await apiExcluir("movimentacoes", id);
            carregar();
        }

        document.getElementById("btnFiltrar").addEventListener("click", carregar);
        seletorUsuario.addEventListener("change", carregar);

        (async () => {
            const usuarios = await carregarUsuarios();
            if (usuarios.length) {
                await carregar();
            } else {
                document.getElementById("conteudo").innerHTML =
                    '<p class="vazio">Cadastre um usuário para ver o extrato.</p>';
            }
        })();
    </script>
</body>
</html>
