<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações — InvestAI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>📈 InvestAI</h1>
        <nav>
            <a href="usuarios.html">Usuários</a>
            <a href="movimentacoes.html" class="ativo">Movimentações</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="metas.html">Metas</a>
        </nav>
    </header>
    <main>
        <div class="topo">
            <h2>Movimentações</h2>
            <a class="btn" href="movimentacao_form.html">+ Nova movimentação</a>
        </div>

        <div id="conteudo">
            <p class="vazio">Carregando...</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        async function carregar() {
            const conteudo = document.getElementById("conteudo");
            try {
                const [itens, usuarios] = await Promise.all([
                    apiListar("movimentacoes"),
                    apiListar("usuarios"),
                ]);
                const nomes = {};
                usuarios.forEach(u => nomes[u.id] = u.nome);

                if (!itens.length) {
                    conteudo.innerHTML = '<p class="vazio">Nenhuma movimentação cadastrada ainda.</p>';
                    return;
                }
                let html = `<table><thead><tr>
                    <th>Descrição</th><th>Tipo</th><th>Valor</th><th>Data</th>
                    <th>Usuário</th><th>Ações</th></tr></thead><tbody>`;
                itens.forEach(m => {
                    const tag = m.tipo === "renda"
                        ? '<span class="tag tag-renda">renda</span>'
                        : '<span class="tag tag-gasto">gasto</span>';
                    html += `<tr>
                        <td>${m.descricao}</td>
                        <td>${tag}</td>
                        <td>${formatarReal(m.valor)}</td>
                        <td>${m.data}</td>
                        <td>${nomes[m.usuario_id] || "-"}</td>
                        <td class="acoes">
                            <a class="btn btn-sec" href="movimentacao_form.html?id=${m.id}">Editar</a>
                            <button class="btn btn-del" onclick="excluir(${m.id})">Excluir</button>
                        </td></tr>`;
                });
                html += "</tbody></table>";
                conteudo.innerHTML = html;
            } catch (e) {
                conteudo.innerHTML = '<p class="aviso">Erro ao conectar na API. Verifique se o backend está rodando.</p>';
            }
        }

        async function excluir(id) {
            if (!confirm("Excluir esta movimentação?")) return;
            await apiExcluir("movimentacoes", id);
            carregar();
        }

        carregar();
    </script>
</body>
</html>
